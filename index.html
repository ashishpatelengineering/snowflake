// ---------------------------------------------------------------------
// RENDERING
// ---------------------------------------------------------------------
const navList = document.getElementById('nav-list');
const container = document.getElementById('sections-container');

function letter(i) {
  return String.fromCharCode(65 + i);
}

sectionsData.forEach((sec, secIndex) => {
  // Nav item
  const li = document.createElement('li');
  const a = document.createElement('a');
  a.href = 'javascript:void(0)';
  a.textContent = sec.navLabel;
  a.dataset.target = sec.id;
  if (sec.pending) {
    const tag = document.createElement('span');
    tag.className = 'nav-pending-tag';
    tag.textContent = 'pending';
    a.appendChild(document.createTextNode(' '));
    a.appendChild(tag);
  }
  if (secIndex === 0) a.classList.add('active');
  li.appendChild(a);
  navList.appendChild(li);

  // Section container
  const secEl = document.createElement('section');
  secEl.className = 'quiz-section' + (secIndex === 0 ? ' active' : '');
  secEl.id = sec.id;

  if (sec.pending) {
    secEl.innerHTML = `
      <h2>${sec.title}</h2>
      <div class="section-meta">${sec.meta}</div>
      <div class="pending-notice">
        The transcript for this lecture has not been added yet, so no questions have been generated.
        Once you send the transcript text for "${sec.title}", questions will appear here in the order the lecture covers them.
      </div>
    `;
    container.appendChild(secEl);
    return;
  }

  secEl.innerHTML = `
    <h2>${sec.title}</h2>
    <div class="section-meta">${sec.meta}</div>
    <div class="progress-bar">${sec.questions.length} question${sec.questions.length === 1 ? '' : 's'} in this section</div>
  `;

  sec.questions.forEach((q, qIndex) => {
    const card = document.createElement('div');
    card.className = 'question-card';
    const qId = `${sec.id}-q${qIndex}`;
    const inputType = q.type === 'msq' ? 'checkbox' : 'radio';
    const typeLabel = q.type === 'msq' ? 'Multiple Answer' : 'Multiple Choice';

    let optionsHtml = '';
    q.options.forEach((opt, oIndex) => {
      optionsHtml += `
        <label id="${qId}-opt${oIndex}">
          <input type="${inputType}" name="${qId}" value="${oIndex}">
          ${opt}
        </label>
      `;
    });

    card.innerHTML = `
      <div class="question-top">
        <span class="q-number">Q${qIndex + 1}.</span>
        <span class="q-type ${q.type}">${typeLabel}</span>
      </div>
      <p class="q-text">${q.text}</p>
      ${q.type === 'msq' ? '<div class="q-hint">Select all options that apply.</div>' : ''}
      <div class="options">${optionsHtml}</div>
      <button class="check-btn" data-qid="${qId}">Check Answer</button>
      <div class="feedback" id="${qId}-feedback"></div>
    `;

    secEl.appendChild(card);
  });

  container.appendChild(secEl);
});

// ---------------------------------------------------------------------
// INTERACTIVITY: checking answers
// ---------------------------------------------------------------------
document.addEventListener('click', function(e) {
  if (!e.target.classList.contains('check-btn')) return;
  const qId = e.target.dataset.qid;
  const [secId, qKey] = [qId.split('-q')[0].replace(/-q\d+$/, ''), qId];

  // find the question object
  let sectionObj, questionObj, qIndex;
  for (const sec of sectionsData) {
    const idx = sec.questions.findIndex((_, i) => `${sec.id}-q${i}` === qId);
    if (idx !== -1) {
      sectionObj = sec;
      questionObj = sec.questions[idx];
      qIndex = idx;
      break;
    }
  }
  if (!questionObj) return;

  const inputs = document.getElementsByName(qId);
  const selected = [];
  inputs.forEach((inp, i) => {
    if (inp.checked) selected.push(i);
  });

  // reset option styling
  questionObj.options.forEach((opt, i) => {
    const label = document.getElementById(`${qId}-opt${i}`);
    label.classList.remove('option-correct', 'option-incorrect');
  });

  const correctSet = new Set(questionObj.correct);
  const selectedSet = new Set(selected);
  const isCorrect = correctSet.size === selectedSet.size &&
    [...correctSet].every(v => selectedSet.has(v));

  // highlight
  questionObj.options.forEach((opt, i) => {
    const label = document.getElementById(`${qId}-opt${i}`);
    if (correctSet.has(i)) {
      label.classList.add('option-correct');
    } else if (selectedSet.has(i)) {
      label.classList.add('option-incorrect');
    }
  });

  const feedbackEl = document.getElementById(`${qId}-feedback`);
  const optionWord = questionObj.correct.length > 1 ? 'options are' : 'option is';

  feedbackEl.className = 'feedback ' + (isCorrect ? 'correct' : 'incorrect');
  feedbackEl.innerHTML = `
    <strong>${isCorrect ? 'Correct!' : `Not quite. The correct ${optionWord} highlighted below.`}</strong>
    <div class="explanation">${questionObj.explanation}</div>
    <div class="source">Source: ${questionObj.source}</div>
    ${questionObj.docLink ? `<div class="doclink"><a href="javascript:void(0)" onclick="window.open('${questionObj.docLink}','_blank')">Snowflake Documentation ↗</a></div>` : ''}
  `;
});

// ---------------------------------------------------------------------
// NAVIGATION between sections
// ---------------------------------------------------------------------
navList.addEventListener('click', function(e) {
  if (e.target.tagName !== 'A') return;
  e.preventDefault();
  const target = e.target.dataset.target;

  document.querySelectorAll('nav.sidebar a').forEach(a => a.classList.remove('active'));
  e.target.classList.add('active');

  document.querySelectorAll('section.quiz-section').forEach(sec => {
    sec.classList.toggle('active', sec.id === target);
  });

  window.scrollTo(0, 0);
});
</script>
