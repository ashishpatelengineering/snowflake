<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The AI Builder's Handbook: Study Companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#161f2e;
    --ink-2:#1e2a3d;
    --paper:#f3efe3;
    --paper-dim:#c9c2ad;
    --amber:#e8a33d;
    --amber-dim:#a97a2f;
    --amber-solid:#e8a33d;
    --slate:#7c8aa0;
    --good:#5fae7a;
    --bad:#d16d6d;
    --serif: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    /* One font family throughout. Hierarchy comes from size and weight, not typeface switching. */
  }
  *{box-sizing:border-box;}
  html, body{
    overflow-x:hidden;
  }
  body{
    margin:0;
    background:var(--ink);
    color:var(--paper);
    font-family:var(--sans);
    min-height:100vh;
  }
  .wrap{
    max-width:1160px;
    margin:0 auto;
    padding:32px 20px 80px;
    display:flex;
    gap:32px;
    align-items:flex-start;
  }
  .sidebar{
    width:220px;
    flex-shrink:0;
    position:sticky;
    top:32px;
  }
  .wrap.collapsed .sidebar{
    display:none;
  }
  .sidebar-label{
    font-size:11px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--slate);
    margin-bottom:12px;
  }
  .sidebar-toggle-btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:var(--ink-2);
    border:1px solid rgba(240,237,228,0.15);
    color:var(--paper-dim);
    font-family:var(--sans);
    font-size:12px;
    padding:7px 12px;
    border-radius:7px;
    cursor:pointer;
    margin-bottom:16px;
  }
  .sidebar-toggle-btn:hover{ border-color:var(--amber); color:var(--amber); }
  .part-label{
    font-size:10px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--slate);
    font-weight:700;
    margin:18px 0 6px 14px;
    white-space:nowrap;
  }
  .part-label:first-child{ margin-top:0; }
  .chapter-tab{
    display:block;
    width:100%;
    text-align:left;
    background:transparent;
    border:none;
    border-left:2px solid rgba(240,237,228,0.12);
    color:var(--paper-dim);
    font-family:var(--sans);
    font-size:13.5px;
    line-height:1.4;
    padding:10px 14px;
    cursor:pointer;
    margin-bottom:2px;
    white-space:normal;
  }
  .chapter-tab .num{
    display:block;
    font-size:10.5px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--slate);
    margin-bottom:2px;
  }
  .chapter-tab.active{
    border-left:2px solid var(--amber);
    color:var(--paper);
    background:rgba(232,163,61,0.06);
  }
  .chapter-tab.active .num{ color:var(--amber); }
  .chapter-tab:hover:not(.active){
    background:rgba(240,237,228,0.04);
    color:var(--paper);
  }
  .main-col{
    flex:1;
    min-width:0;
  }
  @media (max-width:760px){
    .wrap{ flex-direction:column; padding:20px 16px 60px; }
    .sidebar{ width:100%; position:static; }
    .sidebar-toggle-btn{ margin-bottom:16px; }
    .chapter-tab{ display:block; width:100%; border-left:2px solid rgba(240,237,228,0.12); border-bottom:none; margin-right:0; white-space:normal; }
    .chapter-tab.active{ border-left:2px solid var(--amber); border-bottom:none; }
    .part-label{ width:100%; margin:14px 0 6px 4px; }
  }
  header.top{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    border-bottom:1px solid rgba(240,237,228,0.15);
    padding-bottom:14px;
    margin-bottom:28px;
  }
  .sidebar-book-title{
    font-family:var(--sans);
    letter-spacing:0.02em;
    font-size:12px;
    font-weight:600;
    color:var(--paper-dim);
    margin-bottom:18px;
    line-height:1.35;
  }
  header.top h1{
    font-size:21px;
    margin:0;
    font-weight:700;
    color:var(--paper);
  }
  .header-progress{
    display:none;
    margin-top:6px;
    font-size:12px;
    color:var(--slate);
    letter-spacing:0.04em;
  }
  .header-progress.visible{ display:block; }
  .mode-toggle{
    display:flex;
    gap:8px;
  }
  .mode-toggle button{
    background:transparent;
    border:1px solid rgba(240,237,228,0.25);
    color:var(--paper-dim);
    font-family:var(--sans);
    font-size:12px;
    padding:7px 14px;
    border-radius:999px;
    cursor:pointer;
    transition:all .15s;
  }
  .mode-toggle button.active{
    background:var(--amber);
    border-color:var(--amber);
    color:var(--ink);
    font-weight:600;
  }

  @media (max-width:640px){
    header.top{
      flex-direction:column;
      align-items:stretch;
      gap:14px;
    }
    .mode-toggle{
      flex-wrap:wrap;
      gap:6px;
    }
    .mode-toggle button{
      flex:1 1 auto;
      padding:8px 10px;
      font-size:12px;
      text-align:center;
    }
  }

  /* ===== SLIDES ===== */
  #slides{display:block;}
  #quiz{display:none;}
  #glossary{display:none;}

  .glossary-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:16px;
    padding-bottom:16px;
    margin-bottom:20px;
    border-bottom:1px solid rgba(240,237,228,0.12);
  }
  .glossary-search{
    flex:1;
    max-width:340px;
    background:rgba(20,28,42,0.6);
    border:1px solid rgba(240,237,228,0.2);
    color:var(--paper);
    font-family:var(--sans);
    font-size:14px;
    padding:9px 14px;
    border-radius:7px;
  }
  .glossary-search::placeholder{ color:var(--slate); }
  .glossary-search:focus{ outline:none; border-color:var(--amber); }
  .glossary-count{
    font-size:12px;
    color:var(--slate);
    white-space:nowrap;
  }
  .gterm{
    background:var(--ink-2);
    border:1px solid rgba(240,237,228,0.08);
    border-radius:10px;
    padding:18px 22px;
    margin-bottom:10px;
  }
  .gterm .gname{
    font-size:16px;
    font-weight:700;
    color:var(--paper);
    margin-bottom:6px;
  }
  .gterm .gdef{
    font-size:14.5px;
    line-height:1.65;
    color:#dcd8c9;
  }
  .glossary-empty{
    text-align:center;
    padding:40px 20px;
    color:var(--slate);
    font-size:14px;
  }

  /* ===== NOTES ===== */
  .notes-toolbar{
    display:flex;
    justify-content:center;
    margin-bottom:14px;
  }
  .notes-page-number{
    font-family:var(--sans);
    font-size:13px;
    font-weight:600;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--amber);
    background:rgba(232,163,61,0.1);
    border:1px solid rgba(232,163,61,0.3);
    padding:6px 14px;
    border-radius:20px;
  }
  .notes-page-wrap{
    display:flex;
    justify-content:center;
    padding:0 0 40px 0;
    min-width:0;
    width:100%;
    box-sizing:border-box;
  }
  .notes-sheet{
    --n-blue: #1e3a6e;
    --n-red: #a6262f;
    --n-paper: #ffffff;
    width:100%;
    max-width:680px;
    min-width:0;
    background:var(--n-paper);
    position:relative;
    padding:44px 40px 64px 40px;
    box-shadow:0 4px 16px rgba(0,0,0,0.3);
    border-radius:6px;
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    box-sizing:border-box;
  }
  .notes-sheet .n-chapter{
    font-family:'Patrick Hand', sans-serif;
    font-weight:400;
    color:var(--n-red);
    font-size:1.55em;
    margin:0 0 0.25em 0;
    line-height:1.25;
  }
  .notes-sheet .n-section{
    font-family:'Patrick Hand', sans-serif;
    font-weight:400;
    color:var(--n-blue);
    font-size:1.2em;
    margin-bottom:1em;
    display:inline-block;
    border-bottom:2px solid var(--n-red);
    padding-bottom:3px;
  }
  .notes-sheet .n-term{
    font-family:'Patrick Hand', sans-serif;
    font-weight:400;
    color:var(--n-red);
    font-size:1.25em;
    margin:0.9em 0 0.25em 0;
  }
  .notes-sheet p, .notes-sheet li{
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    color:var(--n-blue);
    font-size:0.98em;
    line-height:1.55;
    margin:0.2em 0;
  }
  .notes-sheet ul{ margin:0.2em 0 0.4em 0; padding-left:1.3em; }
  .notes-sheet li::marker{ color:var(--n-red); }
  @media (max-width:640px){
    .notes-sheet{
      font-size:16px;
      padding:28px 22px 48px 22px;
    }
  }

  .slide{
    background:var(--ink-2);
    border:1px solid rgba(240,237,228,0.08);
    border-radius:10px;
    padding:38px 42px;
    min-height:420px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    position:relative;
  }
  .focus-toggle-btn{
    position:absolute;
    top:16px;
    right:16px;
    width:32px;
    height:32px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(20,28,42,0.5);
    border:1px solid rgba(240,237,228,0.15);
    border-radius:7px;
    color:var(--slate);
    cursor:pointer;
    transition:background .15s, color .15s;
    z-index:5;
  }
  .focus-toggle-btn:hover{
    background:rgba(20,28,42,0.9);
    color:var(--paper);
    border-color:rgba(240,237,228,0.3);
  }
  .focus-toggle-btn svg{ width:16px; height:16px; }
  .notes-focus-btn{
    background:rgba(0,0,0,0.06);
    border:1px solid rgba(0,0,0,0.12);
    color:#7a7568;
  }
  .notes-focus-btn:hover{
    background:rgba(0,0,0,0.12);
    color:#3a362e;
    border-color:rgba(0,0,0,0.2);
  }

  /* ===== FOCUS MODE ===== */
  #wrap.focus-mode .sidebar,
  #wrap.focus-mode .sidebar-toggle-btn,
  #wrap.focus-mode header.top{
    display:none !important;
  }
  #wrap.focus-mode .main-col{
    max-width:1120px;
    margin:0 auto;
    padding-top:40px;
  }
  #wrap.focus-mode .slide{
    min-height:65vh;
    padding:64px 76px;
  }
  #wrap.focus-mode .slide .eyebrow{
    font-size:13px;
  }
  #wrap.focus-mode .slide h2{
    font-size:38px;
    margin-bottom:24px;
  }
  #wrap.focus-mode .slide p,
  #wrap.focus-mode .slide li{
    font-size:18px;
    line-height:1.7;
  }
  #wrap.focus-mode .slide .card h3{
    font-size:15px;
  }
  #wrap.focus-mode .slide .card p{
    font-size:16px;
  }
  #wrap.focus-mode .slide .callout,
  #wrap.focus-mode .slide .example{
    font-size:17px;
    padding:22px 26px;
  }
  #wrap.focus-mode #slides .nav,
  #wrap.focus-mode #notes .nav{
    display:none;
  }
  .focus-position{
    display:none;
    text-align:center;
    margin-top:24px;
    font-size:13px;
    letter-spacing:0.08em;
    color:var(--slate);
    text-transform:uppercase;
  }
  #wrap.focus-mode #slides .focus-position{
    display:block;
  }
  @media (max-width: 1200px){
    #wrap.focus-mode .main-col{ max-width:94vw; }
  }
  @media (max-width: 720px){
    #wrap.focus-mode .slide{ padding:32px 24px; min-height:50vh; }
    #wrap.focus-mode .slide h2{ font-size:26px; }
    #wrap.focus-mode .slide p,
    #wrap.focus-mode .slide li{ font-size:16px; }
  }
  #wrap.focus-mode .notes-page-wrap{
    padding-top:20px;
  }
  #wrap.focus-mode .notes-sheet{
    max-width:820px;
    padding:64px 72px 80px 72px;
  }
  #wrap.focus-mode .notes-sheet .n-chapter{ font-size:1.75em; }
  #wrap.focus-mode .notes-sheet .n-section{ font-size:1.35em; }
  #wrap.focus-mode .notes-sheet .n-term{ font-size:1.4em; }
  #wrap.focus-mode .notes-sheet p,
  #wrap.focus-mode .notes-sheet li{ font-size:1.18em; line-height:1.6; }
  @media (max-width: 720px){
    #wrap.focus-mode .notes-sheet{ padding:32px 24px 48px 24px; }
  }
  .slide .eyebrow{
    font-size:11px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--amber);
    margin-bottom:10px;
  }
  .slide h2{
    font-size:27px;
    margin:0 0 18px;
    line-height:1.3;
    font-weight:700;
    letter-spacing:-0.01em;
  }
  .slide p{
    font-size:16px;
    line-height:1.7;
    color:#dcd8c9;
    margin:0 0 14px;
  }
  .slide .callout{
    background:rgba(232,163,61,0.08);
    border-left:3px solid var(--amber);
    padding:12px 16px;
    border-radius:4px;
    font-size:14.5px;
    color:var(--paper);
    margin-top:10px;
  }
  .slide .example{
    background:rgba(20,28,42,0.6);
    border:1px solid rgba(240,237,228,0.1);
    border-radius:6px;
    padding:14px 18px;
    font-family:var(--sans);
    font-size:14px;
    color:var(--paper-dim);
    margin-top:12px;
    line-height:1.7;
  }
  .slide .diagram{
    margin-top:14px;
    background:rgba(20,28,42,0.4);
    border:1px solid rgba(240,237,228,0.08);
    border-radius:8px;
    padding:16px;
  }
  .slide svg text{ font-family:var(--sans); }
  .slide .dcap{
    font-size:12px;
    color:var(--slate);
    text-align:center;
    margin-top:8px;
  }
  /* Standalone SVG diagram colors, hardcoded so they render outside any special runtime */
  .dteal rect{ fill:rgba(95,174,122,0.16); stroke:#5fae7a; }
  .dteal text{ fill:#cfe8d9; }
  .damber rect{ fill:rgba(232,163,61,0.22); stroke:#e8a33d; }
  .damber text{ fill:#f6dcae; }
  .dgray rect{ fill:rgba(124,138,160,0.14); stroke:#7c8aa0; }
  .dgray text{ fill:#c6cdd9; }
  .dsvg-label{ fill:#dcd8c9; }
  .dsvg-sub{ fill:#9aa4b5; font-size:12px; }
  .slide svg .t{ font-size:14px; }
  .slide svg .th{ font-size:14px; font-weight:700; }
  .slide svg .ts{ font-size:12px; }
  .slide svg .arr{ stroke:#7c8aa0; stroke-width:1.2; fill:none; }
  .slide svg text:not(.dteal text):not(.damber text):not(.dgray text){ fill:#dcd8c9; }
  .grid2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
    margin-top:14px;
  }
  .card{
    background:rgba(20,28,42,0.5);
    border:1px solid rgba(240,237,228,0.1);
    border-radius:8px;
    padding:16px 18px;
  }
  .card h3{
    font-size:14.5px;
    margin:0 0 6px;
    color:var(--amber);
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.02em;
  }
  .card p{ font-size:13.5px; margin:0; }
  ul.plain{ padding-left:20px; margin:10px 0; }
  ul.plain li{ font-size:15px; line-height:1.7; color:#dcd8c9; margin-bottom:6px; }

  .nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:22px;
  }
  .nav button{
    background:var(--ink-2);
    border:1px solid rgba(240,237,228,0.2);
    color:var(--paper);
    font-family:var(--sans);
    padding:10px 20px;
    border-radius:7px;
    cursor:pointer;
    font-size:14px;
  }
  .nav button:disabled{ opacity:0.3; cursor:default; }
  .nav button:not(:disabled):hover{ border-color:var(--amber); color:var(--amber); }
  .dots{ display:flex; gap:6px; }
  .dot{
    width:7px; height:7px; border-radius:50%;
    background:rgba(240,237,228,0.2);
    transition:all .2s;
  }
  .dot.active{ background:var(--amber); width:20px; border-radius:4px; }
  .nav-counter{ display:none; }

  @media (max-width:640px){
    .nav{
      gap:10px;
    }
    .nav button{
      padding:12px 16px;
      font-size:14px;
      flex:0 0 auto;
      min-width:88px;
    }
    .dots{ display:none; }
    .nav-counter{
      display:block;
      font-family:var(--sans);
      font-size:13px;
      color:var(--slate);
      white-space:nowrap;
    }
  }

  /* ===== QUIZ ===== */
  .quiz-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding-bottom:16px;
    margin-bottom:20px;
    border-bottom:1px solid rgba(240,237,228,0.12);
  }
  .quiz-head-title{
    font-size:15px;
    font-weight:700;
    color:var(--paper);
  }
  .reset-btn{
    background:transparent;
    border:1px solid rgba(240,237,228,0.25);
    color:var(--paper-dim);
    font-family:var(--sans);
    font-size:12.5px;
    padding:7px 14px;
    border-radius:7px;
    cursor:pointer;
  }
  .reset-btn:hover{ border-color:var(--amber); color:var(--amber); }

  @media (max-width:640px){
    .quiz-head{
      flex-wrap:wrap;
      gap:10px;
      align-items:flex-start;
    }
    .quiz-head-title{
      width:100%;
    }
    .reset-btn{
      white-space:nowrap;
      padding:9px 16px;
    }
  }

  .qcard{
    background:var(--ink-2);
    border:1px solid rgba(240,237,228,0.08);
    border-radius:10px;
    padding:26px 30px;
    margin-bottom:16px;
  }
  .qcard .qnum{
    font-size:11px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--amber);
    margin-bottom:8px;
  }
  .qcard h3{
    font-weight:600;
    font-size:17px;
    margin:0 0 16px;
    line-height:1.5;
  }
  .opt{
    display:block;
    width:100%;
    text-align:left;
    background:rgba(20,28,42,0.5);
    border:1px solid rgba(240,237,228,0.15);
    color:var(--paper);
    padding:12px 16px;
    border-radius:7px;
    margin-bottom:8px;
    cursor:pointer;
    font-size:14.5px;
    font-family:var(--sans);
    transition:all .12s;
  }
  .opt:hover{ border-color:var(--amber); }
  .opt.correct{ border-color:var(--good); background:rgba(95,174,122,0.12); }
  .opt.incorrect{ border-color:var(--bad); background:rgba(209,109,109,0.12); }
  .opt:disabled{ cursor:default; }
  .explain{
    display:none;
    margin-top:10px;
    padding:12px 16px;
    background:rgba(232,163,61,0.06);
    border-left:3px solid var(--amber);
    border-radius:4px;
    font-size:13.5px;
    line-height:1.6;
    color:var(--paper-dim);
  }
  .score-bar{
    text-align:center;
    padding:20px;
    font-family:var(--serif);
    font-size:17px;
    color:var(--amber);
  }
</style>
</head>
<body>
<div class="wrap" id="wrap">

  <aside class="sidebar">
    <div class="sidebar-book-title">The AI Builder's Handbook</div>
    <div class="sidebar-label">Chapters</div>
    <div id="chapterRow"></div>
  </aside>

  <div class="main-col">

    <button class="sidebar-toggle-btn" onclick="toggleSidebar()" id="sidebarToggleBtn" aria-label="Hide chapter list">← Hide chapters</button>

    <header class="top">
      <div>
        <h1 id="chapterTitle">The Language of Generative and Agentic AI</h1>
        <div class="header-progress" id="headerProgress"></div>
      </div>
      <div class="mode-toggle">
        <button id="btnSlides" class="active" onclick="showMode('slides')">Lesson</button>
        <button id="btnQuiz" onclick="showMode('quiz')">Quiz</button>
        <button id="btnGlossary" onclick="showMode('glossary')">Glossary</button>
        <button id="btnNotes" onclick="showMode('notes')">Notes</button>
      </div>
    </header>

    <!-- ============ SLIDES ============ -->
    <div id="slides">
      <div id="slideHost"></div>
      <div class="nav">
        <button id="prevBtn" onclick="go(-1)">← Back</button>
        <div class="dots" id="dots"></div>
        <div class="nav-counter" id="navCounter"></div>
        <button id="nextBtn" onclick="go(1)">Next →</button>
      </div>
      <div class="focus-position" id="focusPosition"></div>
    </div>

<p>four layers written in strict order, structure any AI design conversation, each should fit in a paragraph, if Layer 2 is vague no amount of work on Layer 3 will save you</p>
<div class="n-term">Layer 1: The User and Their Pain</div>
<ul>
  <li>who is the user, what are they doing today, be specific: named role, actual task, measurable pain</li>
  <li>eg: compliance analysts spend 90 minutes per filing, miss 3-5% of required items</li>

<ul>
  <li>what changes when your system works, how do you know, write this before the system</li>
  <li>eg: analyst completes a check in under 20 minutes, miss rate under 1%</li>
</ul>
<div class="n-term">Layer 3: The AI Intervention</div>
<ul>
  <li>what does the AI system actually do, the narrowest useful definition</li>
  <li>often bloated in failed projects, narrow it until it hurts</li>
</ul>
<div class="n-term">Layer 4: The System and Safety</div>
<ul>
  <li>evals, guardrails, observability, human oversight, rollback, audit trail</li>
  <li>the production scaffolding</li>
</ul>`,

`<div class="n-section">Six Traps We See Constantly</div>
<p>after thirty-plus enterprise implementations, six design traps come up over and over, recognizing one is often enough to avoid it</p>
<div class="n-term">Tech-First Thinking</div>
<ul>
  <li>"we want to use AI for X", AI is the given, the problem is the search, ends up building something without a user</li>
</ul>
<div class="n-term">Over-Scoping</div>
<ul>
  <li>three problems packed into one system because they feel related, does none of them well, impossible to evaluate</li>
</ul>
<div class="n-term">Problem With No Owner</div>
<ul>
  <li>a vaguely-agreed pain nobody actually has to live with, cannot define the outcome measurably</li>
</ul>
<div class="n-term">Solutioning in the Problem Statement</div>
<ul>
  <li>describes an architecture, the actual problem (who hurts, where, how much) is missing</li>
  <li>eg: "build an LLM with RAG and a workflow agent", describe the pain first</li>
</ul>
<div class="n-term">Skipping the Human Baseline</div>
<ul>
  <li>never measuring how long the task takes a human or how often they get it wrong</li>
  <li>without a baseline you cannot tell if the AI system is an improvement</li>
</ul>
<div class="n-term">Confusing Pilot Success With Production Readiness</div>
<ul>
  <li>a pilot on curated data shows it works under ideal conditions, not how it holds up against real edge cases</li>
</ul>`,

`<div class="n-section">A Scoping Template You Can Use</div>

<ul>
  <li>who is the user? named role, not "employees"</li>
  <li>what are they doing today, and how is it painful? describe the workflow, time it, measure the error rate</li>
  <li>what would change if the new system works? describe the new workflow</li>
  <li>what is the single AI capability at the core? one sentence, one pattern</li>
  <li>what does "ready to ship" mean? specific eval scores, guardrail coverage, a rollback plan</li>
  <li>what can go wrong, and what happens when it does? enumerate failure modes, map each to a recovery path</li>

const glossary = [
{ term:"Generative AI", chapter:1, def:"AI (Artificial Intelligence) that creates new content, text, images, audio, video, code, rather than just analyzing or sorting things that already exist. ChatGPT, Midjourney, and Claude are all generative AI." },
  { term:"Foundation Model", chapter:1, def:"A large, general-purpose AI model trained on massive amounts of data, built to be adapted for many different tasks rather than one specific job. GPT, Claude, Gemini, and Llama are all foundation models." },
  { term:"Large Language Model (LLM)", chapter:1, def:"A foundation model trained specifically on language: it reads text and generates text. It works by predicting likely patterns from its training data, not by looking up facts in a database." },
  { term:"Tokens", chapter:1, def:"The small pieces of text a model actually processes, roughly a word or part of a word. Models are priced and limited by how many tokens they read and write." },
  { term:"Context Window", chapter:1, def:"The total amount of text (measured in tokens) a model can \"see\" and consider at once, including your prompt, chat history, and any documents provided. Bigger isn't automatically better; models can lose track of details buried in the middle of a very long context." },
  { term:"Pretraining, Fine-Tuning, Post-Training", chapter:1, def:"The three stages of building a model. Pretraining teaches it language from huge amounts of raw data. Fine-tuning specializes it for a narrower task using a smaller dataset. Post-training (including techniques like RLHF, or Reinforcement Learning from Human Feedback) polishes its behavior, tone, and safety." },
  { term:"Chain-of-Thought", chapter:1, def:"A technique where a model is prompted to reason through a problem step by step before giving its final answer, which often improves accuracy on math, logic, and multi-step questions." },
  { term:"Reasoning Models", chapter:1, def:"A class of models built to think longer and more carefully before responding, trading extra time and cost for better performance on hard, multi-step problems." },
  { term:"Multimodality", chapter:1, def:"A model's ability to work with more than just text, such as understanding images, audio, or video, not only reading and writing words." },
  { term:"Prompting", chapter:1, def:"Writing input to an AI model in a way that reliably gets you the output you want. Part clear communication, part trial and error." },
  { term:"System Prompt", chapter:1, def:"A hidden instruction set placed above the user's messages that defines the model's role, rules, and behavior for an entire conversation." },
  { term:"Few-Shot and In-Context Learning", chapter:1, def:"Teaching a model a pattern by showing it a few examples directly in the prompt, rather than retraining it. The model picks up the pattern on the spot." },
  { term:"Context Engineering", chapter:1, def:"The broader practice of deciding exactly what information, instructions, and tools to put into a model's context, and in what order, to get the best possible result. A wider discipline than writing one clever prompt." },
  { term:"Tool Use and Function Calling", chapter:1, def:"Giving a model access to external functions, like a search engine, a database, or a calculator, so it can fetch information or take actions beyond just generating text." },
  { term:"Agent", chapter:1, def:"An AI system that can use tools repeatedly and decide its own next steps to accomplish a goal, rather than just responding once to a single instruction." },
  { term:"Workflow vs Agent", chapter:1, def:"A workflow follows a fixed, human-designed sequence of steps with the AI filling in the details. An agent decides its own sequence of steps on the fly. Workflows are more predictable; agents are more flexible but harder to control." },
  { term:"Router and Classifier Patterns", chapter:1, def:"A setup where one AI call first figures out what kind of request it's dealing with, then hands it off to the right specialized handler, similar to a receptionist directing calls to the correct department." },
  { term:"Specialist and Sub-Agent", chapter:1, def:"A component focused on one narrow task within a larger system, with its own dedicated prompt and tools, as opposed to a general-purpose model trying to do everything." },
  { term:"Multi-Agent System", chapter:1, def:"A setup where multiple AI agents work together, each handling part of a larger problem and communicating with one another. Powerful, but complex to build and debug well." },
  { term:"Retrieval", chapter:1, def:"Looking up relevant information (from documents, databases, or the web) and feeding it to a model before it answers, so its response is grounded in real, current information rather than only what it remembers from training." },
  { term:"RAG (Retrieval-Augmented Generation)", chapter:1, def:"A common pattern where a model retrieves relevant documents first, then uses them as context to generate its answer. One specific way of doing retrieval, not the only one." },
  { term:"Semantic Search and Embeddings", chapter:1, def:"A way of finding information based on meaning rather than exact keyword matches. Text is converted into embeddings, lists of numbers that represent meaning, and similar meanings end up numerically close together." },

{ term:"Benchmark", chapter:3, def:"A standardized test used to measure and compare how well different AI models perform on specific tasks. MMLU and HumanEval are two widely used examples, each a fixed set of questions every model can be scored against. Useful for a rough sense of quality, but not a substitute for testing on your own use case." },

  { term:"Open-Source Model vs Closed Model", chapter:3, def:"An open model's weights are publicly available and can be run and modified by anyone. A closed model can only be accessed through the provider's own API, with the underlying weights kept private." },

{ term:"Problem-First Design", chapter:4, def:"The practice of clearly defining who has a problem and what that problem actually is before writing any code or prompts, rather than starting with a technology and looking for a use for it." },
  { term:"Scoping", chapter:4, def:"The process of clearly defining the boundaries of a project before building it, what it will do, who it's for, and what counts as done." },

  { term:"Pilot", chapter:4, def:"A small, controlled test of a system with a limited group of users, run to see whether an idea works before committing to building it for everyone." },
  { term:"Rollback Plan", chapter:4, def:"A predefined way to quickly undo or disable a system if something goes wrong after launch, restoring the previous working state." },

{ term:"Code-Based Eval", chapter:7, def:"A test that checks an AI system's output using plain code instead of human judgment or another model, returning a simple pass or fail. Fast, cheap, and doesn't need any labeled examples to run." },

  { term:"Draft-Then-Confirm", chapter:12, def:"A safety pattern where an AI proposes an action but a human has to approve it before it actually happens, rather than the AI acting on its own." },
{ term:"Chunk", chapter:13, def:"A smaller piece of a larger document, split up so it can be individually searched and retrieved, since a whole long document is too big to search effectively as one unit." },
  { term:"Reranking", chapter:13, def:"A second pass over an initial list of search results that re-scores and reorders them more carefully, using a smaller specialized model, to surface the truly best matches near the top." },

let activeChapter = 0;
let idx = 0;
let notesIdx = 0;

function renderChapterRow(){
  const row = document.getElementById('chapterRow');
  let html = '';
  let lastPart = null;
  chapters.forEach((c,i)=>{
    if(c.part && c.part !== lastPart){
      html += `<div class="part-label">${c.part}</div>`;
      lastPart = c.part;
    }
    html += `<button class="chapter-tab ${i===activeChapter?'active':''}" onclick="switchChapter(${i})">
      <span class="num">Chapter ${c.id}</span>${c.title}
    </button>`;
  });
  row.innerHTML = html;
}

function switchChapter(i){
  activeChapter = i;
  idx = 0;
  notesIdx = 0;
  document.getElementById('chapterTitle').innerText = chapters[i].title;
  renderChapterRow();
  renderSlide();
  renderQuiz();
  showMode('slides');
  document.getElementById('btnSlides').classList.add('active');
  document.getElementById('btnQuiz').classList.remove('active');
}

/* ---------------- SLIDE RENDERING ---------------- */
function renderSlide(){
  const slides = chapters[activeChapter].slides;
  const s = slides[idx];
  document.getElementById('slideHost').innerHTML = `
    <div class="slide">
      <button class="focus-toggle-btn" onclick="toggleFocusMode()" aria-label="Toggle focus mode" id="focusToggleBtn">${focusIconSVG(false)}</button>
      <div class="eyebrow">${s.eyebrow}</div>
      <h2>${s.title}</h2>
      ${s.body}
    </div>
  `;
  document.getElementById('prevBtn').disabled = idx===0;
  document.getElementById('nextBtn').disabled = idx===slides.length-1;
  document.getElementById('nextBtn').innerText = idx===slides.length-1 ? 'Done' : 'Next →';
  document.getElementById('focusPosition').innerText = (idx+1) + ' / ' + slides.length;
  const hp = document.getElementById('headerProgress');
  hp.innerText = 'Slide ' + (idx+1) + ' of ' + slides.length;
  hp.classList.add('visible');
  renderDots();
  syncFocusIcon();
  window.scrollTo({top:0, behavior:'smooth'});
}
function renderDots(){
  const slides = chapters[activeChapter].slides;
  document.getElementById('dots').innerHTML = slides.map((_,i)=>
    `<div class="dot ${i===idx?'active':''}"></div>`
  ).join('');
  document.getElementById('navCounter').innerText = (idx+1) + ' / ' + slides.length;
}
function go(dir){
  const slides = chapters[activeChapter].slides;
  const next = idx + dir;
  if(next>=0 && next<slides.length){ idx = next; renderSlide(); }
}

/* ---------------- SWIPE GESTURES ---------------- */
(function(){
  let touchStartX = 0;
  let touchStartY = 0;
  const threshold = 50;

  document.addEventListener('touchstart', function(e){
    if(!e.touches || e.touches.length !== 1) return;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, {passive:true});

  document.addEventListener('touchend', function(e){
    if(!e.changedTouches || e.changedTouches.length !== 1) return;
    const slidesVisible = document.getElementById('slides').style.display !== 'none';
    const notesVisible = document.getElementById('notes').style.display !== 'none';
    if(!slidesVisible && !notesVisible) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    if(Math.abs(dx) < threshold || Math.abs(dx) < Math.abs(dy)) return;
    const dir = dx < 0 ? 1 : -1;
    if(slidesVisible) go(dir); else goNotes(dir);
  }, {passive:true});
})();

/* ---------------- FOCUS MODE ---------------- */
let focusMode = false;
function focusIconSVG(isFocused){
  return isFocused
    ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V5a2 2 0 0 1 2-2h4M20 9V5a2 2 0 0 0-2-2h-4M4 15v4a2 2 0 0 0 2 2h4M20 15v4a2 2 0 0 1-2 2h-4"/></svg>`
    : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>`;
}
function toggleFocusMode(){
  focusMode = !focusMode;
  document.getElementById('wrap').classList.toggle('focus-mode', focusMode);
  syncFocusIcon();
}
function syncFocusIcon(){
  const btn = document.getElementById('focusToggleBtn');
  if(btn) btn.innerHTML = focusIconSVG(focusMode);
  const btnNotes = document.getElementById('focusToggleBtnNotes');
  if(btnNotes) btnNotes.innerHTML = focusIconSVG(focusMode);
}
document.addEventListener('keydown', function(e){
  if(!focusMode) return;
  const tag = (e.target && e.target.tagName) || '';
  if(tag === 'INPUT' || tag === 'TEXTAREA') return;
  if(e.key === 'Escape'){ e.preventDefault(); toggleFocusMode(); return; }
  if(e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
  const dir = e.key === 'ArrowRight' ? 1 : -1;
  const slidesVisible = document.getElementById('slides').style.display !== 'none';
  const notesVisible = document.getElementById('notes').style.display !== 'none';
  if(slidesVisible){ e.preventDefault(); go(dir); }
  else if(notesVisible){ e.preventDefault(); goNotes(dir); }
});

/* ---------------- MODE TOGGLE ---------------- */
function showMode(mode){
  document.getElementById('slides').style.display = mode==='slides' ? 'block' : 'none';
  document.getElementById('quiz').style.display = mode==='quiz' ? 'block' : 'none';
  document.getElementById('glossary').style.display = mode==='glossary' ? 'block' : 'none';
  document.getElementById('notes').style.display = mode==='notes' ? 'block' : 'none';
  document.getElementById('btnSlides').classList.toggle('active', mode==='slides');
  document.getElementById('btnQuiz').classList.toggle('active', mode==='quiz');
  document.getElementById('btnGlossary').classList.toggle('active', mode==='glossary');
  document.getElementById('btnNotes').classList.toggle('active', mode==='notes');
  document.getElementById('headerProgress').classList.toggle('visible', mode==='slides');
  if(mode==='glossary') renderGlossary();
  if(mode==='notes') renderNotes();
  window.scrollTo({top:0, behavior:'smooth'});
}

/* ---------------- GLOSSARY ---------------- */
function renderGlossary(filterText){
  const host = document.getElementById('glossary');
  const q = (filterText || '').trim().toLowerCase();
  const chapterId = chapters[activeChapter].id;
  const chapterTerms = glossary.filter(g => g.chapter === chapterId);
  const sorted = [...chapterTerms].sort((a,b)=>a.term.localeCompare(b.term));
  const filtered = q ? sorted.filter(g =>
    g.term.toLowerCase().includes(q) || g.def.toLowerCase().includes(q)
  ) : sorted;

  let html = `<div class="glossary-head">
    <input type="text" class="glossary-search" id="glossarySearch" placeholder="Search this chapter's terms..." value="${(filterText||'').replace(/"/g,'&quot;')}" oninput="renderGlossary(this.value)">
    <div class="glossary-count">${filtered.length} of ${chapterTerms.length} terms</div>
  </div>`;

  if(chapterTerms.length === 0){
    html += `<div class="glossary-empty">No glossary terms for this chapter yet.</div>`;
  } else if(filtered.length === 0){
    html += `<div class="glossary-empty">No terms match "${q}". Try a different search.</div>`;
  } else {
    filtered.forEach(g => {
      html += `<div class="gterm">
        <div class="gname">${g.term}</div>
        <div class="gdef">${g.def}</div>
      </div>`;
    });
  }
  host.innerHTML = html;

  const input = document.getElementById('glossarySearch');
  if(input && filterText !== undefined){
    input.focus();
    input.setSelectionRange(input.value.length, input.value.length);
  }
}

/* ---------------- NOTES ---------------- */
function renderNotes(){
  const host = document.getElementById('notes');
  const chapter = chapters[activeChapter];
  const pages = chapter.notes;

  if(!pages || pages.length === 0){
    host.innerHTML = `<div class="glossary-empty">Handwritten notes for this chapter are not ready yet. Check back soon.</div>`;
    return;
  }

  if(notesIdx >= pages.length) notesIdx = pages.length - 1;
  if(notesIdx < 0) notesIdx = 0;
  const page = pages[notesIdx];

  let html = `<div class="notes-toolbar">
    <div class="notes-page-number">Page ${notesIdx+1} of ${pages.length}</div>
  </div>
  <div class="notes-page-wrap">
    <div class="notes-sheet">
      <button class="focus-toggle-btn notes-focus-btn" onclick="toggleFocusMode()" aria-label="Toggle focus mode" id="focusToggleBtnNotes">${focusIconSVG(focusMode)}</button>
      ${page}
    </div>
  </div>
  <div class="nav">
    <button onclick="goNotes(-1)" ${notesIdx===0?'disabled':''}>← Back</button>
    <div class="dots">${pages.map((_,i)=>`<div class="dot ${i===notesIdx?'active':''}"></div>`).join('')}</div>
    <button onclick="goNotes(1)" ${notesIdx===pages.length-1?'disabled':''}>Next →</button>
  </div>
  <div class="focus-position">${notesIdx+1} / ${pages.length}</div>`;

  host.innerHTML = html;
  window.scrollTo({top:0, behavior:'smooth'});
}
function goNotes(dir){
  const pages = chapters[activeChapter].notes;
  if(!pages) return;
  const next = notesIdx + dir;
  if(next>=0 && next<pages.length){ notesIdx = next; renderNotes(); }
}

/* ---------------- QUIZ ---------------- */
function renderQuiz(){
  const quizData = chapters[activeChapter].quiz;
  const host = document.getElementById('quiz');
  let html = `<div class="quiz-head">
    <div class="quiz-head-title">${quizData.length} questions</div>
    <button class="reset-btn" onclick="resetQuiz()">Retake quiz</button>
  </div>`;
  quizData.forEach((item, i)=>{
    const tag = item.type==='scenario' ? ' · Applied' : (item.type==='multi' ? ' · Select all that apply' : '');
    html += `<div class="qcard" id="q${i}">
      <div class="qnum">Question ${i+1} of ${quizData.length}${tag}</div>
      <h3>${item.q}</h3>`;
    if(item.type==='multi'){
      item.options.forEach((opt, oi)=>{
        html += `<label class="opt" id="opt${i}_${oi}" style="display:flex;align-items:center;gap:10px;cursor:pointer;">
          <input type="checkbox" id="chk${i}_${oi}" style="width:16px;height:16px;flex-shrink:0;">
          <span>${opt}</span>
        </label>`;
      });
      html += `<button onclick="submitMulti(${i})" style="margin-top:8px;background:var(--amber);border:none;color:var(--ink);font-weight:700;padding:9px 18px;border-radius:7px;cursor:pointer;font-size:13.5px;" id="submitBtn${i}">Check answer</button>`;
      html += `<div class="explain" id="exp${i}">${item.explain}</div>`;
    } else {
      item.options.forEach((opt, oi)=>{
        html += `<button class="opt" id="opt${i}_${oi}" onclick="answer(${i},${oi})">${opt}</button>`;
      });
      html += `<div class="explain" id="exp${i}">${item.explain}</div>`;
    }
    html += `</div>`;
  });
  host.innerHTML = html;
}

function resetQuiz(){
  renderQuiz();
  window.scrollTo({top:0, behavior:'smooth'});
}

function answer(qi, oi){
  const quizData = chapters[activeChapter].quiz;
  const item = quizData[qi];
  for(let o=0;o<item.options.length;o++){
    const btn = document.getElementById(`opt${qi}_${o}`);
    btn.disabled = true;
    if(o===item.correct) btn.classList.add('correct');
    else if(o===oi) btn.classList.add('incorrect');
  }
  const correctText = item.options[item.correct];
  document.getElementById(`exp${qi}`).innerHTML = '<strong>Correct answer: ' + correctText + '</strong><br><br>' + item.explain;
  document.getElementById(`exp${qi}`).style.display = 'block';
}

function submitMulti(qi){
  const quizData = chapters[activeChapter].quiz;
  const item = quizData[qi];
  const correctSet = new Set(item.correctSet);
  item.options.forEach((opt, oi)=>{
    const chk = document.getElementById(`chk${qi}_${oi}`);
    const label = document.getElementById(`opt${qi}_${oi}`);
    chk.disabled = true;
    const picked = chk.checked;
    const shouldBeChecked = correctSet.has(oi);
    if(shouldBeChecked && picked) label.classList.add('correct');
    else if(shouldBeChecked && !picked) label.classList.add('correct');
    else if(!shouldBeChecked && picked) label.classList.add('incorrect');
  });
  document.getElementById(`submitBtn${qi}`).disabled = true;
  document.getElementById(`submitBtn${qi}`).style.opacity = '0.4';
  const correctTexts = item.correctSet.map(i => item.options[i]).join(', ');
  document.getElementById(`exp${qi}`).innerHTML = '<strong>Correct options: ' + correctTexts + '</strong><br><br>' + item.explain;
  document.getElementById(`exp${qi}`).style.display = 'block';
}
